<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navBar">
        <div id="leftNav">
           <strong>GPA Calculator</strong> 
        </div>

        <div id="rightNav">
            <div class="rNav"> <a href="#container">Home</a></div>
            <div class="rNav"><a href="#aboutContact">About</a></div>
            <div class="rNav"> <a href="#aboutContact">Contact</a></div>
            <div class="rNav"><a href="pointAndWeight.html">Grade Calculator</a></div>
        </div>
    </div>

    <div id="container">
        <div class="course-input">
            <h2>Current Courses</h2>
            <div id="courses">
                <div class="course">
                    <input type="text" class="course-name" placeholder="Course Name">
                    <select class="grade">
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="B-">B-</option>
                        <option value="C+">C+</option>
                        <option value="C">C</option>
                        <option value="C-">C-</option>
                        <option value="D+">D+</option>
                        <option value="D">D</option>
                        <option value="F">F</option>
                    </select>
                    <input type="number" class="credits" step="0.5" placeholder="Credits">
                    <button class="remove-course">Remove</button>
                </div>
            </div>
            <br>
            <button id="add-course">Add Course</button>
        </div>

        <div class="input-section">
            <label for="current-gpa">Current GPA (optional):</label>
            <input type="number" id="current-gpa" step="0.01" placeholder="Enter current GPA">
            
            <label for="total-credits">Total Credits (optional):</label>
            <input type="number" id="total-credits" step="0.5" placeholder="Enter total credits">
        </div>
        
        <button id="calculate-gpa">Calculate GPA</button>
        <div id="result"></div>
    </div>

    <div id="secondpage">
        <div id="aboutContact">
            <h2>About</h2>
            <p>Welcome to the GPA calculator page. This tool helps you calculate your GPA based on your courses, grades, and credits.</p>
            
            <h2>Contact</h2>
            <form action="mailto:muktan.sonam542@email.com" method="post" enctype="text/plain">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
            
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
